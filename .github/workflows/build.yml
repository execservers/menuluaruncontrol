name: Build x86 and x64 DLLs and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            bits: '32'
            mode: default
            stdout: 'OFF'
            dll: menuluaruncontrol_win32.dll
          - arch: x64
            bits: '64'
            mode: default
            stdout: 'OFF'
            dll: menuluaruncontrol_win64.dll
          - arch: Win32
            bits: '32'
            mode: stdout
            stdout: 'ON'
            dll: menuluaruncontrol_stdout_win32.dll
          - arch: x64
            bits: '64'
            mode: stdout
            stdout: 'ON'
            dll: menuluaruncontrol_stdout_win64.dll
    steps:
      - uses: actions/checkout@v4
      - name: Configure ${{ matrix.arch }} / ${{ matrix.mode }}
        run: cmake -S . -B build -A ${{ matrix.arch }} -DMENULUARUNCONTROL_STDOUT=${{ matrix.stdout }}
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: menuluaruncontrol-${{ matrix.mode }}-win${{ matrix.bits }}
          path: |
            build/Release/${{ matrix.dll }}
            build/Release/menuluaruncontrol_console_win*.exe
          if-no-files-found: error

  release:
    # PRs only build. Every pushed commit and manual run publishes its DLLs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: menuluaruncontrol-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: menuluaruncontrol-*
          path: dist
          merge-multiple: true
      - name: Verify four DLLs and two companion viewers
        shell: bash
        run: |
          set -euo pipefail
          for dll in \
            menuluaruncontrol_win32.dll \
            menuluaruncontrol_win64.dll \
            menuluaruncontrol_stdout_win32.dll \
            menuluaruncontrol_stdout_win64.dll \
            menuluaruncontrol_console_win32.exe \
            menuluaruncontrol_console_win64.exe; do
            test -s "dist/$dll"
          done
      - name: Publish commit release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="commit-${GITHUB_SHA:0:12}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          notes="$(printf '%s\n\n**Source commit:** [%s](%s)\n\n%s\n' \
            'Automated x86/x64 default and _stdout_ builds.' \
            "$GITHUB_SHA" "$commit_url" \
            'The _stdout_ DLL requires its matching console viewer EXE in the same directory.')"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Update the description only. Do not replace immutable release assets.
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/*.dll dist/*.exe \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes" \
              --latest=false
          fi
